services:
  - type: web
    # Render can't move a service between regions, so the Singapore deploy is a new service.
    name: bumper-buddies-sg
    region: singapore
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GHOUSE_PIN
        sync: false
